name: Daily TechnoFunda Swing Scan & Supabase Sync

on:
  schedule:
    # 10:15 UTC = 15:45 (3:45 PM) IST, Monday to Friday (After NSE/BSE market close)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force_mock:
        description: 'Simulate high-volume breakouts if market quiet (true/false)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run TechnoFunda Pipeline and Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCREENER_SESSION_ID: ${{ secrets.SCREENER_SESSION_ID }}
          FORCE_MOCK: ${{ github.event.inputs.force_mock }}
        run: |
          python backend/supabase_sync.py

      - name: Commit and push updated trade datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Fundamental_Shortlist.xlsx Final_Trade_Triggers.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update daily trade triggers and fundamental shortlist [skip ci]" && git push)
